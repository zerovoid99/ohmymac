# tmux config (managed by ~/Code/ohmymac)
# Prefix is Ctrl+Space. Plugins are managed by TPM: prefix + I installs, prefix + U updates.

# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi

# ── Prefix ───────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Keybinds ─────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# splits open in the current path
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"   # same as |, no Shift needed
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resize panes with prefix + hjkl (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind m resize-pane -Z          # toggle zoom

# windows: prefix + number (default), prefix + n / p for next / previous.
# Alt+number and Alt+h/l are deliberately left to AeroSpace (workspaces / focus).
bind -r n next-window
bind -r p previous-window

# vi-style copy mode
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Catppuccin Mocha status bar ──────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# ── Plugins (TPM) ────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"     # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin "tmux-plugins/tmux-continuum"     # auto save/restore sessions
set -g @plugin "christoomey/vim-tmux-navigator"  # Ctrl+hjkl moves between tmux panes and nvim splits
set -g @plugin "catppuccin/tmux#v2.1.3"

set -g @continuum-restore "on"
# navigator: keep Ctrl+hjkl, but drop its Ctrl+\ "last pane" key. It fires by accident
# when Ctrl is still held after the prefix (e.g. prefix then Shift+\ for |).
set -g @vim_navigator_mapping_prev ""
set -g @resurrect-strategy-nvim "session"

# catppuccin must be loaded before the status line is assembled
run "~/.config/tmux/plugins/tmux/catppuccin.tmux"
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %H:%M"

run "~/.config/tmux/plugins/tpm/tpm"
